name: Check Code before Merge

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - develop

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install Packages
        run: pnpm install --frozen-lockfile

      - name: Code Check
        run: pnpm lint

      - name: Type Check
        run: pnpm typecheck

      - name: Dependencies Check
        run: pnpm depcheck

      - name: Testing
        run: pnpm test
