name: Check Code before Merge

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - develop
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install Packages
        run: pnpm install --frozen-lockfile

      - name: Code Check
        run: pnpm lint

      - name: Code Format
        run: pnpm format

      - name: Type Check
        run: pnpm typecheck

      - name: Dependencies Check
        run: pnpm depcheck

      - name: Copy env file
        run: cp packages/kernel/.env.example packages/kernel/.env

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database
        run: |
          until docker compose exec -T db pg_isready -U pinjarium -d pinjarium; do
            sleep 2
          done

      - name: Run migrations
        run: pnpm db:migrate

      - name: Testing
        run: pnpm test
